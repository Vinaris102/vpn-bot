# /etc/nginx/sites-available/vpnbot
# После установки: ln -s /etc/nginx/sites-available/vpnbot /etc/nginx/sites-enabled/
# Замените ваш-домен.com на реальный домен, направленный A-записью на IP сервера.

server {
    listen 80;
    server_name ваш-домен.com;

    # Certbot будет использовать этот путь для проверки домена
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ваш-домен.com;

    ssl_certificate     /etc/letsencrypt/live/ваш-домен.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ваш-домен.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Только эндпоинт вебхука наружу — остальное не публикуем
    location /yookassa/webhook {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
